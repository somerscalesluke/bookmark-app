<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saved</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Saved">
<meta name="theme-color" content="#EEF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171C" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2314181F'/%3E%3Crect x='14' y='30' width='36' height='12' fill='%23FFE45C' transform='rotate(-6 32 36)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF0F3; --surface:#FFFFFF; --ink:#14181F; --muted:#6C7380; --line:#D9DDE3; --marker:#FFE45C; --danger:#C8321F;
  --shadow:0 1px 2px rgba(20,24,31,.06),0 8px 24px -12px rgba(20,24,31,.25);
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Inter Tight",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
  --gutter:clamp(16px,3vw,32px); --r:14px;
}
@media (prefers-color-scheme:dark){:root{--paper:#14171C;--surface:#1D2127;--ink:#ECEEF1;--muted:#8B93A0;--line:#2C323B;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6)}}
*{box-sizing:border-box;margin:0}
html,body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;min-height:100%}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--marker);outline-offset:2px}
.hide{display:none!important}

/* header */
header{display:flex;align-items:center;gap:14px;padding:calc(env(safe-area-inset-top) + 14px) var(--gutter) 10px;position:sticky;top:0;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(14px);z-index:5}
.brand{font:700 26px/1 var(--display);letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:22px;height:9px;background:var(--marker);transform:rotate(-6deg);border-radius:2px}
.search{flex:1;min-width:0;max-width:420px;margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.search input{flex:1;border:0;background:none;outline:0;min-width:0}
.search input::placeholder{color:var(--muted)}
.iconbtn{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--surface);color:var(--ink)}

main{padding:8px var(--gutter) calc(env(safe-area-inset-bottom) + 48px);max-width:1400px;margin:0 auto}
.eyebrow{font:500 12px/1 var(--mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:18px 0 14px}
.eyebrow.row{display:flex;align-items:center;gap:10px;margin-top:12px}
.eyebrow.row .sortctl{margin-left:auto;text-transform:none;letter-spacing:.03em}
/* sort control: [caret][key] */
.sortctl{display:inline-flex;align-items:stretch}
.sortctl .chip{border-radius:0}
.sortctl .caret{border-radius:999px 0 0 999px;padding:7px 7px 7px 10px;display:grid;place-items:center}
.sortctl .caret svg{transition:transform .18s}
.sortctl .caret.up svg{transform:rotate(180deg)}
.sortctl .key{border-radius:0 999px 999px 0;border-left:0}
.sortctl .chip:hover + .chip{border-left-color:var(--line)}
h1{font:700 clamp(28px,4vw,40px)/1.05 var(--display);letter-spacing:-.025em}
.mark{position:relative;display:inline-block}
.mark::after{content:"";position:absolute;left:-.1em;right:-.1em;bottom:.08em;height:.38em;background:var(--marker);z-index:-1;transform:rotate(-1.2deg);border-radius:2px}
@media (prefers-color-scheme:dark){.mark::after{opacity:.85}}

/* board stacks */
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:26px 20px}
.stack{text-align:left;display:flex;flex-direction:column;gap:10px}
.pile{position:relative;aspect-ratio:1/1;width:100%}
.pile img,.pile .blank{position:absolute;inset:8%;width:84%;height:84%;object-fit:cover;border-radius:10px;background:var(--surface);box-shadow:var(--shadow);border:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.pile .blank{display:grid;place-items:center;color:var(--muted);font:500 12px var(--mono)}
.pile > :nth-child(1){transform:rotate(-7deg) translate(-4%,2%)}
.pile > :nth-child(2){transform:rotate(4deg) translate(5%,-1%)}
.pile > :nth-child(3){transform:rotate(-2deg) translate(1%,-4%)}
.pile > :nth-child(4){transform:rotate(1deg)}
.stack:hover .pile > :nth-child(1){transform:rotate(-10deg) translate(-8%,3%)}
.stack:hover .pile > :nth-child(2){transform:rotate(7deg) translate(9%,-2%)}
.pile>*{transition:transform .25s cubic-bezier(.2,.7,.2,1)}
.stack .name{font:700 17px/1.2 var(--display);letter-spacing:-.01em}
.stack .count{font:500 12px var(--mono);color:var(--muted);margin-top:2px}
.stack.unsorted .name::after{content:"needs sorting";font:500 10px var(--mono);color:var(--ink);background:var(--marker);padding:2px 6px;border-radius:4px;margin-left:8px;vertical-align:middle;letter-spacing:.04em}

/* board page */
.boardhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 18px;margin:14px 0 18px}
.back{font:500 13px var(--mono);color:var(--muted);letter-spacing:.04em}
.back:hover{color:var(--ink)}
.boardhead .count{font:500 13px var(--mono);color:var(--muted)}
.boardhead .actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:4px}
.chip{font:500 12px var(--mono);letter-spacing:.03em;padding:7px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface);white-space:nowrap}
.chip:hover{color:var(--ink);border-color:var(--ink)}
.chip.danger:hover{color:var(--danger);border-color:var(--danger)}

/* items masonry */
.grid{columns:5 220px;column-gap:16px}
.card{break-inside:avoid;display:block;margin:0 0 16px;background:var(--surface);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);position:relative;transition:transform .2s}
.card:hover{transform:translateY(-2px)}
.card img{display:block;width:100%;height:auto;background:var(--line)}
.card .ph{aspect-ratio:4/3;display:grid;place-items:center;background:linear-gradient(135deg,var(--paper),var(--surface));color:var(--muted);font:700 40px var(--display);letter-spacing:-.04em}
.card .body{padding:11px 12px 12px}
.card .title{font:600 14px/1.3 var(--body);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;align-items:center;gap:8px;margin-top:8px;font:500 11px var(--mono);color:var(--muted);letter-spacing:.03em;min-width:0}
.card .meta .src{color:var(--ink);background:var(--paper);padding:2px 6px;border-radius:4px;text-transform:uppercase}
.card .meta span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .more{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(6px);display:grid;place-items:center;color:var(--ink);opacity:0;transition:opacity .15s;box-shadow:var(--shadow)}
.card:hover .more,.card:focus-within .more{opacity:1}
@media (hover:none){.card .more{opacity:1}}
.card .summary{font-size:13px;color:var(--muted);margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card.partial .title::before{content:"no preview · ";color:var(--muted);font-weight:500}

/* sheet / dialogs */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:min(100%,480px);max-height:80vh;overflow:auto;border-radius:20px 20px 0 0;padding:14px 16px calc(env(safe-area-inset-bottom) + 16px);box-shadow:var(--shadow)}
@media (min-width:640px){.sheet{border-radius:18px}}
.sheet h2{font:700 20px/1.2 var(--display);margin:6px 4px 12px;letter-spacing:-.02em}
.sheet .sub{color:var(--muted);font-size:13px;margin:-8px 4px 12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 10px;border-radius:10px;font-size:15px}
.opt:hover{background:var(--paper)}
.opt .k{font:500 11px var(--mono);color:var(--muted);margin-left:auto}
.opt.danger{color:var(--danger)}
.opt.current{font-weight:600}
.opt.current::after{content:"current";font:500 10px var(--mono);background:var(--marker);color:#14181F;padding:2px 6px;border-radius:4px;margin-left:auto}
.opt .hint{font-size:12px;color:var(--muted);margin-left:6px}
.field{display:flex;gap:8px;margin:6px 4px 10px}
.field input{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 12px;outline:0}
.field input:focus{border-color:var(--ink)}
.btn{background:var(--ink);color:var(--paper);border-radius:10px;padding:11px 16px;font-weight:600}
.btn.ghost{background:none;color:var(--muted);border:1px solid var(--line)}
hr.sep{border:0;border-top:1px solid var(--line);margin:8px 0}
.field textarea{flex:1;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 12px;outline:0;min-height:96px;resize:vertical;font:inherit}
.field textarea:focus{border-color:var(--ink)}
.field.col{flex-direction:column}
.lbl{font:500 11px var(--mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin:10px 4px 4px}

/* selection mode */
.selecting .card a{pointer-events:none}
.card .tick{position:absolute;top:8px;left:8px;width:26px;height:26px;border-radius:50%;border:2px solid var(--paper);background:color-mix(in srgb,var(--surface) 70%,transparent);backdrop-filter:blur(6px);display:none;place-items:center;box-shadow:var(--shadow)}
.selecting .card .tick{display:grid}
.selecting .card .more{display:none}
.card.on{outline:3px solid var(--marker);outline-offset:-3px}
.card.on .tick{background:var(--marker);border-color:var(--marker);color:#14181F}
.card.on .tick::after{content:"";width:8px;height:13px;border:solid #14181F;border-width:0 3px 3px 0;transform:translateY(-2px) rotate(45deg)}
.bulk{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:var(--ink);color:var(--paper);padding:8px 8px 8px 16px;border-radius:24px;box-shadow:var(--shadow);z-index:15;max-width:calc(100% - 24px);flex-wrap:wrap;justify-content:center;white-space:nowrap;animation:pop .2s}
.bulk .n{font:500 13px var(--mono);margin-right:6px}
.bulk button{color:var(--paper);padding:8px 12px;border-radius:999px;font-weight:600;font-size:14px}
.bulk button:hover{background:color-mix(in srgb,var(--paper) 15%,transparent)}
.bulk button.danger{color:#FF8A75}
.bulk button.x{opacity:.7;padding:8px 10px}

/* in-app preview */
.viewer{position:fixed;inset:0;z-index:25;background:var(--paper);display:flex;flex-direction:column;animation:rise .22s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.viewer .bar{display:flex;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;border-bottom:1px solid var(--line);background:var(--surface)}
.viewer .bar .t{flex:1;min-width:0;font:600 14px/1.25 var(--body);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer .bar .t small{display:block;font:500 11px var(--mono);color:var(--muted);letter-spacing:.03em;margin-top:2px}
.viewer .bar .iconbtn{color:var(--ink)}
.viewer .bar .iconbtn:disabled{opacity:.3}
.viewer .frame{flex:1;position:relative;background:#000}
.viewer iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.viewer .frame.light{background:var(--paper)}
.viewer .frame.light iframe{background:var(--surface)}
.viewer .foot{display:flex;gap:8px;padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);background:var(--surface);border-top:1px solid var(--line);font:500 12px var(--mono);color:var(--muted);align-items:center}
.viewer .foot a{margin-left:auto;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.viewer .fallback{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--muted);background:var(--paper)}
.viewer .fallback b{display:block;color:var(--ink);font:700 22px var(--display);margin-bottom:6px}
body.viewing{overflow:hidden}

/* auth + empty */
.center{min-height:80vh;display:grid;place-items:center;text-align:center;padding:24px}
.center .box{max-width:360px}
.center p{color:var(--muted);margin:8px 0 18px}
.empty{color:var(--muted);text-align:center;padding:60px 20px;font-size:15px}
.empty b{color:var(--ink);display:block;font:700 22px var(--display);margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-weight:500;z-index:40;box-shadow:var(--shadow);animation:pop .2s}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <a class="brand" href="#" id="home"><i></i>Saved</a>
  <label class="search hide" id="searchWrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" type="search" placeholder="Search everything you saved" autocomplete="off"></label>
  <button class="iconbtn hide" id="settings" title="Settings" aria-label="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>
<main id="main"></main>
<div id="layer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://dmqrroajctiiojbtsxbu.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtcXJyb2FqY3RpaW9qYnRzeGJ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1Mjc0MTksImV4cCI6MjEwNTEwMzQxOX0.ZyVQmtLl1R7gTy67WFVJnFQJVdaK55rymA_vU8-ou4w";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const state = { user: null, boards: [], items: [], board: null, q: "", selecting: false, sel: new Set(), sort: { cards: null, boards: null } };
const plural = (n, w = "card") => `${n} ${w}${n === 1 ? "" : "s"}`;
const main = $("#main"), layer = $("#layer");

// ---------- sorting ----------
// key → { label (sheet), chip (short), hint, dir (default), cmp(a,b) ascending, only ("all" = Everything view only) }
const ts = (v) => (v ? Date.parse(v) || 0 : 0);
const titleOf = (i) => (i.title || hostOf(i.url) || "").trim();
const byText = (a, b) => a.localeCompare(b, undefined, { sensitivity: "base", numeric: true });
const SORTS = {
  cards: {
    added:    { label: "Date added",    chip: "added",    dir: "desc", cmp: (a, b) => ts(a.created_at) - ts(b.created_at) },
    modified: { label: "Date modified", chip: "modified", dir: "desc", cmp: (a, b) => (ts(a.updated_at || a.created_at) - ts(b.updated_at || b.created_at)) || (ts(a.created_at) - ts(b.created_at)) },
    title:    { label: "Title",         chip: "title",    dir: "asc",  cmp: (a, b) => byText(titleOf(a), titleOf(b)) },
    source:   { label: "Source",        chip: "source",   dir: "asc",  hint: "instagram, tiktok, article…", cmp: (a, b) => byText(srcOf(a), srcOf(b)) || ts(b.created_at) - ts(a.created_at) },
    board:    { label: "Board",         chip: "board",    dir: "asc",  only: "all", cmp: (a, b) => byText(boardName(a.board_id), boardName(b.board_id)) || ts(b.created_at) - ts(a.created_at) },
  },
  boards: {
    size:    { label: "Number of cards", chip: "size",    dir: "desc", cmp: (a, b) => (a.item_count - b.item_count) || byText(b.name, a.name) },
    saved:   { label: "Last saved to",   chip: "saved",   dir: "desc", cmp: (a, b) => (ts(a.last_saved_at) - ts(b.last_saved_at)) || (ts(a.created_at) - ts(b.created_at)) },
    name:    { label: "Name",            chip: "name",    dir: "asc",  cmp: (a, b) => byText(a.name, b.name) },
    created: { label: "Date created",    chip: "created", dir: "desc", cmp: (a, b) => ts(a.created_at) - ts(b.created_at) },
  },
};
const DEFAULT_SORT = { cards: { key: "added", dir: "desc" }, boards: { key: "size", dir: "desc" } };
function getSort(kind) {
  if (!state.sort[kind]) {
    let s = null; try { s = JSON.parse(localStorage.getItem("sort." + kind) || "null"); } catch {}
    state.sort[kind] = s && SORTS[kind][s.key] && ["asc", "desc"].includes(s.dir) ? s : { ...DEFAULT_SORT[kind] };
  }
  const s = state.sort[kind];
  // "board" only makes sense on Everything; fall back silently elsewhere
  if (kind === "cards" && SORTS.cards[s.key].only === "all" && state.board) return DEFAULT_SORT.cards;
  return s;
}
function saveSort(kind, next) { state.sort[kind] = next; try { localStorage.setItem("sort." + kind, JSON.stringify(next)); } catch {} return next; }
const setSortKey = (kind, key) => saveSort(kind, { key, dir: SORTS[kind][key].dir });   // picking a key resets to that key's natural direction
const flipSort = (kind) => { const s = getSort(kind); return saveSort(kind, { key: s.key, dir: s.dir === "asc" ? "desc" : "asc" }); };
function sortList(kind, list) {
  const s = getSort(kind), def = SORTS[kind][s.key], sign = s.dir === "asc" ? 1 : -1;
  return [...list].sort((a, b) => sign * def.cmp(a, b));
}
// [caret][key] control. Caret toggles asc/desc; key opens the picker.
function sortControl(kind) {
  const s = getSort(kind), asc = s.dir === "asc";
  return `<span class="sortctl" data-sort="${kind}"><button class="chip caret ${asc ? "up" : ""}" data-flip title="${asc ? "Ascending — tap for descending" : "Descending — tap for ascending"}" aria-label="Sort direction: ${asc ? "ascending" : "descending"}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button><button class="chip key" data-pick title="Sort ${kind} by…">${SORTS[kind][s.key].chip}</button></span>`;
}
function refreshSortControl(kind) {
  const el = main.querySelector(`.sortctl[data-sort="${kind}"]`); if (!el) return;
  const s = getSort(kind), asc = s.dir === "asc", c = el.querySelector(".caret");
  c.classList.toggle("up", asc); c.title = asc ? "Ascending — tap for descending" : "Descending — tap for ascending"; c.setAttribute("aria-label", `Sort direction: ${asc ? "ascending" : "descending"}`);
  el.querySelector(".key").textContent = SORTS[kind][s.key].chip;
}
function bindSortControl(kind, onChange) {
  const el = main.querySelector(`.sortctl[data-sort="${kind}"]`); if (!el) return;
  el.querySelector("[data-flip]").onclick = () => { flipSort(kind); refreshSortControl(kind); onChange(); };
  el.querySelector("[data-pick]").onclick = () => sortSheet(kind, () => { refreshSortControl(kind); onChange(); });
}
function sortSheet(kind, onChange) {
  const cur = getSort(kind);
  const opts = Object.entries(SORTS[kind]).filter(([, d]) => !(kind === "cards" && d.only === "all" && state.board)).map(([k, d]) =>
    `<button class="opt ${cur.key === k ? "current" : ""}" data-a="s:${k}">${esc(d.label)}${d.hint ? `<span class="hint">${esc(d.hint)}</span>` : ""}</button>`).join("");
  sheet(`<h2>Sort ${kind} by</h2>${opts}`, (a) => { if (a.startsWith("s:")) { setSortKey(kind, a.slice(2)); onChange(); } });
}

// ---------- auth ----------
async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  state.user = session?.user ?? null;
  sb.auth.onAuthStateChange((_e, s) => { const was = !!state.user; state.user = s?.user ?? null; if (!!state.user !== was) route(); });
  if (location.hash.includes("access_token") || location.search.includes("code=")) history.replaceState(null, "", location.pathname);
  route();
}
function renderAuth(sent) {
  $("#searchWrap").classList.add("hide"); $("#settings").classList.add("hide");
  main.innerHTML = `<div class="center"><div class="box">
    <h1><span class="mark">Saved</span></h1>
    <p>${sent ? "Check your email for a sign-in link. Open it on this device." : "Everything you shared from your phone, sorted into boards."}</p>
    ${sent ? "" : `<form id="authForm" class="field" style="margin:0"><input id="email" type="email" required placeholder="you@example.com" autocomplete="email"><button class="btn">Send link</button></form>`}
  </div></div>`;
  $("#authForm")?.addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = $("#email").value.trim();
    const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
    if (error) return toast(error.message);
    renderAuth(true);
  });
}

// ---------- data ----------
async function loadBoards() {
  const { data, error } = await sb.from("board_summaries").select("*").order("name");
  if (error) return toast(error.message);
  state.boards = (data ?? []).sort((a, b) => (a.name === "Unsorted") - (b.name === "Unsorted") || b.item_count - a.item_count || a.name.localeCompare(b.name));
}
async function loadItems(boardId) {
  let qy = sb.from("items").select("id,board_id,url,canonical_url,source,title,description,author,site_name,thumbnail_url,original_thumbnail_url,ai_summary,ai_tags,ai_confidence,status,created_at,updated_at,blurb,copied_from").order("created_at", { ascending: false }).limit(600);
  if (boardId) qy = qy.eq("board_id", boardId);
  const { data, error } = await qy;
  if (error) return toast(error.message);
  state.items = data ?? [];
}

// ---------- routing ----------
function route() {
  if (!state.user) return renderAuth(false);
  $("#searchWrap").classList.remove("hide"); $("#settings").classList.remove("hide");
  const id = location.hash.replace(/^#\/?/, "");
  if (id === "all") return renderBoard(null);
  if (id) return renderBoard(id);
  renderHome();
}
window.addEventListener("hashchange", route);
$("#home").onclick = (e) => { e.preventDefault(); location.hash = ""; };
$("#settings").onclick = () => settingsSheet();
$("#search").addEventListener("input", (e) => { state.q = e.target.value.trim().toLowerCase(); if (state.board === undefined) return; renderItems(); });
$("#search").addEventListener("focus", () => { if (!location.hash) location.hash = "#all"; });

// ---------- home ----------
async function renderHome() {
  state.board = undefined; exitSelect();
  await loadBoards();
  const total = state.boards.reduce((n, b) => n + b.item_count, 0);
  if (!total) { main.innerHTML = `<div class="empty"><b>Nothing saved yet</b>Share a link from any app to "Save to Bookmarks" and it will show up here.</div>`; return; }
  const shown = state.boards.filter(b => b.item_count || (b.created_by === "user" && b.name !== "Unsorted"));
  const sorted = [...sortList("boards", shown.filter(b => b.name !== "Unsorted")), ...shown.filter(b => b.name === "Unsorted")];
  main.innerHTML = `<div class="eyebrow row"><span>${plural(total)} · ${state.boards.filter(b => b.item_count).length} boards</span>${sortControl("boards")}</div>
  <div class="boards">
    <a class="stack" href="#all"><div class="pile">${pile(state.boards.map(b => (b.cover_thumbnails ?? [])[0]).filter(Boolean).slice(0, 4), "All")}</div><div><div class="name">Everything</div><div class="count">${plural(total)}</div></div></a>
    ${sorted.map(b => `<a class="stack ${b.name === "Unsorted" && b.item_count ? "unsorted" : ""}" href="#${b.id}"><div class="pile">${pile(b.cover_thumbnails ?? [], b.name)}</div><div><div class="name">${esc(b.name)}</div><div class="count">${plural(b.item_count)}</div></div></a>`).join("")}
  </div>`;
  bindSortControl("boards", renderHome);
}
function pile(thumbs, name) {
  const t = thumbs.filter(Boolean).slice(0, 4).reverse();
  if (!t.length) return `<div class="blank">${esc(name.slice(0, 2).toUpperCase())}</div>`;
  return t.map((u) => `<img src="${esc(u)}" alt="" loading="lazy">`).join("");
}

// ---------- board ----------
async function renderBoard(boardId) {
  state.board = boardId; exitSelect();
  if (!state.boards.length) await loadBoards();
  const b = boardId ? state.boards.find((x) => x.id === boardId) : null;
  if (boardId && !b) { location.hash = ""; return; }
  main.innerHTML = `<div class="boardhead">
    <a class="back" href="#">← boards</a>
    <h1><span class="mark">${esc(b ? b.name : "Everything")}</span></h1>
    <span class="count" id="count"></span>
    <div class="actions">${sortControl("cards")}<button class="chip" data-act="select">select</button>${b ? `<button class="chip" data-act="rename">rename</button><button class="chip" data-act="merge">merge into…</button>${b.name !== "Unsorted" ? `<button class="chip danger" data-act="delete">delete</button>` : ""}` : ""}</div>
  </div><div class="grid" id="grid"></div>`;
  main.querySelectorAll("[data-act]").forEach((el) => el.onclick = () => el.dataset.act === "select" ? toggleSelect() : boardAction(el.dataset.act, b));

}

}

  grid.innerHTML = list.map((i) => `<article class="card ${i.status === "partial" && !i.thumbnail_url ? "partial" : ""} ${state.sel.has(i.id) ? "on" : ""}" data-id="${i.id}">
    <a href="${esc(i.url)}" target="_blank" rel="noopener">
      ${i.thumbnail_url ? `<img src="${esc(i.thumbnail_url)}" alt="" loading="lazy">` : `<div class="ph">${esc((i.site_name || hostOf(i.url)).slice(0, 1).toUpperCase())}</div>`}
      <div class="body"><div class="title">${esc(i.title || hostOf(i.url))}</div>
      ${(i.blurb || i.ai_summary) ? `<div class="summary">${esc(i.blurb || i.ai_summary)}</div>` : ""}
      <div class="meta"><span class="src">${esc(i.source === "article" ? hostOf(i.url).replace(/^www\./, "").split(".")[0] : i.source)}</span><span>${esc(i.author || i.site_name || "")}</span></div></div>
    </a>

  </article>`).join("");
  grid.querySelectorAll("[data-more]").forEach((el) => el.onclick = (e) => { e.preventDefault(); itemMenu(el.dataset.more); });

    if (state.selecting) { e.preventDefault(); return toggleOne(el.dataset.id); }
    if (e.target.closest("a") && openMode() === "app") { const it = state.items.find((x) => x.id === el.dataset.id); if (it && embedOf(it)) { e.preventDefault(); openViewer(it.id); } }
  }));

const hostOf = (u) => { try { return new URL(u).hostname; } catch { return ""; } };
const srcOf = (i) => i.source === "article" ? "article " + hostOf(i.url).replace(/^www\./, "") : (i.source || "");

// ---------- selection mode ----------
function toggleSelect() { state.selecting ? exitSelect() : enterSelect(); }
function enterSelect() { state.selecting = true; state.sel.clear(); main.classList.add("selecting"); const c = main.querySelector('[data-act="select"]'); if (c) c.textContent = "done"; renderItems(); }
function exitSelect() { state.selecting = false; state.sel.clear(); main.classList.remove("selecting"); const c = main.querySelector('[data-act="select"]'); if (c) c.textContent = "select"; $("#bulk")?.remove(); }
function toggleOne(id) { state.sel.has(id) ? state.sel.delete(id) : state.sel.add(id); main.querySelector(`.card[data-id="${id}"]`)?.classList.toggle("on", state.sel.has(id)); renderBulk(); }
function renderBulk() {
  $("#bulk")?.remove(); if (!state.selecting) return;
  const n = state.sel.size, all = visibleItems().length;
  const c = plural(n);
  layer.insertAdjacentHTML("beforeend", `<div class="bulk" id="bulk"><span class="n">${n ? `${n} of ${all} selected` : `Tap cards to select (${all})`}</span>
    <button data-b="all">${n === all ? "Select none" : "Select all"}</button>${n ? `<button data-b="move">Move ${c}</button><button data-b="copy">Copy ${c}</button><button class="danger" data-b="delete">Delete ${c}</button>` : ""}<button class="x" data-b="x" aria-label="Done">✕</button></div>`);
  $("#bulk").querySelectorAll("[data-b]").forEach((el) => el.onclick = () => bulkAction(el.dataset.b));
}
async function bulkAction(a) {
  const ids = [...state.sel];
  if (a === "x") return exitSelect();
  if (a === "all") { const v = visibleItems(); if (state.sel.size === v.length) state.sel.clear(); else v.forEach((i) => state.sel.add(i.id)); return renderItems(); }
  if (a === "delete") {
    if (!confirm(`Delete ${plural(ids.length)}? This can't be undone.`)) return;
    const { error } = await sb.from("items").delete().in("id", ids); if (error) return toast(error.message);
    state.items = state.items.filter((x) => !state.sel.has(x.id)); loadBoards(); exitSelect(); renderItems(); toast(`Deleted ${plural(ids.length)}`);
  }
  if (a === "move" || a === "copy") pickBoard(a === "move" ? `Move ${plural(ids.length)} to` : `Copy ${plural(ids.length)} to`, (boardId) => a === "move" ? moveMany(ids, boardId) : copyMany(ids, boardId));
}
function pickBoard(title, onPick, excludeBoardId) {
  const opts = state.boards.filter((b) => b.id !== excludeBoardId).map((b) => `<button class="opt" data-a="b:${b.id}">${esc(b.name)}<span class="k">${b.item_count}</span></button>`).join("");
  sheet(`<h2>${esc(title)}</h2><form class="field" id="newb"><input placeholder="New board name" id="nb"><button class="btn">Create</button></form>${opts}`,
    (a) => { if (a.startsWith("b:")) onPick(a.slice(2)); },
    async (form) => { const name = $("#nb", form).value.trim(); if (!name) return; const b = await createBoard(name); if (b) onPick(b.id); });
}
async function moveMany(ids, boardId) {
  const { error } = await sb.from("items").update({ board_id: boardId, filed_by: "user" }).in("id", ids); if (error) return toast(error.message);
  const name = boardName(boardId);
  const now = new Date().toISOString();
  state.items.forEach((i) => { if (ids.includes(i.id)) { i.board_id = boardId; i.updated_at = now; } });
  if (state.board) state.items = state.items.filter((i) => i.board_id === state.board);
  loadBoards(); closeSheet(); exitSelect(); renderItems(); toast(`Moved ${plural(ids.length)} to ${name}`);
}
async function copyMany(ids, boardId) {
  const src = state.items.filter((i) => ids.includes(i.id) && i.board_id !== boardId);
  if (!src.length) { closeSheet(); return toast("Already on that board"); }
  const rows = src.map((i) => ({ user_id: state.user.id, board_id: boardId, url: i.url, canonical_url: i.canonical_url, source: i.source, title: i.title, description: i.description, author: i.author, site_name: i.site_name, thumbnail_url: i.thumbnail_url, original_thumbnail_url: i.original_thumbnail_url, ai_summary: i.ai_summary, ai_tags: i.ai_tags, ai_confidence: i.ai_confidence, blurb: i.blurb, filed_by: "user", status: i.status, copied_from: i.copied_from || i.id }));
  const { data, error } = await sb.from("items").insert(rows).select("id"); if (error) return toast(error.message);
  loadBoards(); closeSheet(); exitSelect(); if (!state.board) { await loadItems(null); renderItems(); } toast(`Copied ${plural(data.length)} to ${boardName(boardId)}`);
}
const boardName = (id) => state.boards.find((b) => b.id === id)?.name ?? "board";

// ---------- single card actions ----------
function itemMenu(id) {
  const it = state.items.find((x) => x.id === id); if (!it) return;
  const cur = state.boards.find((b) => b.id === it.board_id);
  sheet(`<h2>${esc(it.title || hostOf(it.url))}</h2><div class="sub">${cur ? "In " + esc(cur.name) : ""}${it.copied_from ? " · copy" : ""}</div>
    ${embedOf(it) ? `<button class="opt" data-a="preview">Preview in app</button>` : ""}
    <button class="opt" data-a="open">Open in browser <span class="k">${esc(hostOf(it.url))}</span></button>
    <button class="opt" data-a="edit">Edit title & description</button>
    <button class="opt" data-a="move">Move to another board</button>
    <button class="opt" data-a="copyto">Copy to another board</button>
    <button class="opt" data-a="copy">Copy link</button>
    <hr class="sep"><button class="opt danger" data-a="delete">Delete</button>`, async (a) => {
    if (a === "open") window.open(it.url, "_blank");
    if (a === "preview") openViewer(it.id);
    if (a === "copy") { await navigator.clipboard.writeText(it.url); toast("Link copied"); }
    if (a === "edit") editItem(it);
    if (a === "move") pickBoard("Move to", (b) => moveMany([it.id], b), it.board_id);
    if (a === "copyto") pickBoard("Copy to", (b) => copyMany([it.id], b), it.board_id);
    if (a === "delete") { if (!confirm("Delete this card?")) return; const { error } = await sb.from("items").delete().eq("id", it.id); if (error) return toast(error.message); state.items = state.items.filter((x) => x.id !== it.id); if (viewer.id === it.id) closeViewer(); loadBoards(); renderItems(); toast("Deleted"); }
  });
}
function editItem(it) {
  sheet(`<h2>Edit card</h2><form id="ef"><div class="lbl">Title</div><div class="field"><input id="et" value="${esc(it.title || "")}" maxlength="300"></div>
    <div class="lbl">Description</div><div class="field col"><textarea id="ed" maxlength="1000" placeholder="${esc(it.ai_summary || "What is this and why did you save it?")}">${esc(it.blurb || "")}</textarea></div>
    <div class="field" style="justify-content:flex-end"><button type="button" class="btn ghost" id="ecancel">Cancel</button><button class="btn">Save</button></div></form>`, () => {}, async (form) => {
    const title = $("#et", form).value.trim(), blurb = $("#ed", form).value.trim();
    const { error } = await sb.from("items").update({ title: title || it.title, blurb: blurb || null }).eq("id", it.id); if (error) return toast(error.message);
    it.title = title || it.title; it.blurb = blurb || null; it.updated_at = new Date().toISOString(); closeSheet(); renderItems(); toast("Saved");
  });
  $("#ecancel").onclick = closeSheet;
}
async function createBoard(name) {
  const { data, error } = await sb.from("boards").insert({ user_id: state.user.id, name, created_by: "user" }).select().single();
  if (error) { toast(error.message.includes("duplicate") ? "A board with that name already exists" : error.message); return null; }
  await loadBoards(); return data;
}

// ---------- board actions ----------
async function boardAction(act, b) {
  if (act === "rename") {
    sheet(`<h2>Rename board</h2><form class="field" id="rn"><input id="rname" value="${esc(b.name)}" autofocus><button class="btn">Save</button></form>`, () => {}, async (form) => {
      const name = $("#rname", form).value.trim(); if (!name || name === b.name) return closeSheet();
      const { error } = await sb.from("boards").update({ name }).eq("id", b.id); if (error) return toast(error.message);
      closeSheet(); await loadBoards(); renderBoard(b.id); toast("Renamed");
    });
  }
  if (act === "merge") {
    const opts = state.boards.filter((x) => x.id !== b.id).map((x) => `<button class="opt" data-a="${x.id}">${esc(x.name)}<span class="k">${x.item_count}</span></button>`).join("");
    sheet(`<h2>Merge “${esc(b.name)}” into…</h2><div class="sub">All ${plural(b.item_count)} move there and this board is removed.</div>${opts}`, async (target) => {
      const { error } = await sb.from("items").update({ board_id: target }).eq("board_id", b.id); if (error) return toast(error.message);
      if (b.name !== "Unsorted") await sb.from("boards").delete().eq("id", b.id);
      closeSheet(); await loadBoards(); location.hash = "#" + target; toast("Merged");
    });
  }
  if (act === "delete") {
    if (!confirm(`Delete “${b.name}”? Its ${plural(b.item_count)} move to Unsorted.`)) return;
    let uns = state.boards.find((x) => x.name === "Unsorted") || await createBoard("Unsorted");
    if (b.item_count) { const { error } = await sb.from("items").update({ board_id: uns.id }).eq("board_id", b.id); if (error) return toast(error.message); }
    await sb.from("boards").delete().eq("id", b.id);
    loadBoards(); location.hash = ""; toast("Board deleted");
  }
}

// ---------- in-app preview ----------
// Official embed endpoints are iframe-friendly; the original pages mostly are not (X-Frame-Options).
// Articles: until ingest stores an `embeddable` flag (batch 2) they open in the browser.
function embedOf(it) {
  const u = it.canonical_url || it.url || "";
  let m;
  if ((m = u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/)|youtu\.be\/)([\w-]{6,})/))) return { src: `https://www.youtube-nocookie.com/embed/${m[1]}?playsinline=1&autoplay=1&rel=0`, kind: "youtube" };
  if ((m = u.match(/tiktok\.com\/.*\/video\/(\d+)/))) return { src: `https://www.tiktok.com/embed/v2/${m[1]}`, kind: "tiktok" };
  if ((m = u.match(/instagram\.com\/(?:[^/]+\/)?(?:p|reel|reels|tv)\/([\w-]+)/))) return { src: `https://www.instagram.com/p/${m[1]}/embed/captioned/`, kind: "instagram", light: true };
  if (it.embeddable === true) return { src: it.url, kind: "page", light: true };
  return null;
}
const openMode = () => { try { return localStorage.getItem("open.mode") === "browser" ? "browser" : "app"; } catch { return "app"; } };
const setOpenMode = (m) => { try { localStorage.setItem("open.mode", m); } catch {} };
const viewer = { id: null, list: [] };
function openViewer(id, fromHistory) {
  const list = visibleItems().filter((i) => embedOf(i)); // thumb through only what can show in-app
  const it = state.items.find((x) => x.id === id); if (!it) return;
  if (!fromHistory && !viewer.id) history.pushState({ viewer: id }, "");
  else if (!fromHistory) history.replaceState({ viewer: id }, "");
  viewer.id = id; viewer.list = list;
  const idx = list.findIndex((i) => i.id === id), em = embedOf(it);
  const nav = (dir) => { const n = list[idx + dir]; if (n) openViewer(n.id); };
  $("#viewer")?.remove(); document.body.classList.add("viewing");
  layer.insertAdjacentHTML("beforeend", `<div class="viewer" id="viewer" role="dialog" aria-label="Preview">
    <div class="bar">
      <button class="iconbtn" data-v="close" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 5-7 7 7 7"/></svg></button>
      <div class="t">${esc(it.title || hostOf(it.url))}<small>${esc(it.author || it.site_name || hostOf(it.url))}${list.length > 1 ? ` · ${idx + 1}/${list.length}` : ""}</small></div>
      <button class="iconbtn" data-v="prev" aria-label="Previous" ${idx <= 0 ? "disabled" : ""}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m14 6-6 6 6 6"/></svg></button>
      <button class="iconbtn" data-v="next" aria-label="Next" ${idx >= list.length - 1 ? "disabled" : ""}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m10 6 6 6-6 6"/></svg></button>
      <button class="iconbtn" data-v="more" aria-label="More"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
    </div>
    <div class="frame ${em && em.light ? "light" : ""}">${em ? `<iframe src="${esc(em.src)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen; clipboard-write" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>` : `<div class="fallback"><b>No in-app preview</b>This site doesn't allow embedding.</div>`}</div>
    <div class="foot"><span>${esc(em ? em.kind : "page")}</span><a href="${esc(it.url)}" target="_blank" rel="noopener">Open in browser ↗</a></div>
  </div>`);
  const v = $("#viewer");
  v.querySelector('[data-v="close"]').onclick = () => closeViewer();
  v.querySelector('[data-v="close"]').focus({ preventScroll: true });
  v.querySelector('[data-v="prev"]').onclick = () => nav(-1);
  v.querySelector('[data-v="next"]').onclick = () => nav(1);
  v.querySelector('[data-v="more"]').onclick = () => itemMenu(it.id);
  // swipe left/right on the bar to move between cards (the iframe eats touches in the body)
  let x0 = null; v.querySelector(".bar").addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
  v.querySelector(".bar").addEventListener("touchend", (e) => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 60) nav(dx < 0 ? 1 : -1); }, { passive: true });
}
function closeViewer(fromHistory) {
  if (!viewer.id) return;
  viewer.id = null; viewer.list = []; $("#viewer")?.remove(); document.body.classList.remove("viewing");
  if (!fromHistory && history.state?.viewer) history.back();
}
window.addEventListener("popstate", (e) => {
  if (e.state?.viewer && state.user) return openViewer(e.state.viewer, true);
  if (viewer.id) closeViewer(true);
});
function settingsSheet() {
  const m = openMode();
  sheet(`<h2>Settings</h2><div class="lbl">Open cards</div>
    <button class="opt ${m === "app" ? "current" : ""}" data-a="mode:app">In app<span class="hint">YouTube, TikTok, Instagram preview here</span></button>
    <button class="opt ${m === "browser" ? "current" : ""}" data-a="mode:browser">In browser<span class="hint">always leave the app</span></button>
    <hr class="sep"><button class="opt" data-a="signout">Sign out <span class="k">${esc(state.user?.email || "")}</span></button>`, async (a) => {
    if (a.startsWith("mode:")) { setOpenMode(a.slice(5)); toast(a.endsWith("app") ? "Cards open in app" : "Cards open in the browser"); }
    if (a === "signout") { await sb.auth.signOut(); location.hash = ""; }
  });
}

// ---------- ui bits ----------
function sheet(html, onPick, onSubmit) {
  $("#scrim")?.remove(); layer.insertAdjacentHTML("beforeend", `<div class="scrim" id="scrim"><div class="sheet" role="dialog">${html}</div></div>`);
  $("#scrim").onclick = (e) => { if (e.target.id === "scrim") closeSheet(); };
  layer.querySelectorAll("[data-a]").forEach((el) => el.onclick = () => { const a = el.dataset.a; if (!["move", "copyto", "edit"].includes(a)) closeSheet(); onPick(a); });
  const form = layer.querySelector("form"); if (form && onSubmit) form.onsubmit = (e) => { e.preventDefault(); onSubmit(form); };
  layer.querySelector("input")?.focus();
}
function closeSheet() { $("#scrim")?.remove(); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if ($("#scrim")) return closeSheet(); if (viewer.id) return closeViewer(); exitSelect(); } });
let toastT; function toast(msg) { clearTimeout(toastT); $("#toast")?.remove(); layer.insertAdjacentHTML("beforeend", `<div class="toast" id="toast">${esc(msg)}</div>`); toastT = setTimeout(() => $("#toast")?.remove(), 2200); }
document.addEventListener("visibilitychange", () => { if (!document.hidden && state.user) route(); });
boot();
</script>
